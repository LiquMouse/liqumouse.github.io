# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: LiquMouse
subtitle: 'LiquMouse'
description: ''
keywords: "Python, C++, WSL"
author: LiquMouse
language: zh-CN
timezone: ''

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://liqumouse.github.io
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
## 图片有两种放法，scripts/image-link.js 都支持：
##   false —— 集中放在 source/image/（notes 分支的 image/ 会在构建时合并进来）
##   true  —— 每篇文章一个同名资源目录 _posts/<分类>/<文章名>/，图片随文章走；
##            需要在 Obsidian 侧把附件目录设为「当前文件夹下的子文件夹」并指定同名目录
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: prismjs
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: true
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
## 由 GitHub Actions 构建时，checkout 会把所有文件的 mtime 变成构建时刻，
## 用 mtime 会导致全站“更新于”跟着每次构建变化，所以改用 date。
updated_option: 'date'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
  - scripts/**
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: hexo-theme-matery

# Deployment
## 已交由 GitHub Actions 部署（见 notes 分支的 .github/workflows/build.yml），
## 本机不再执行 hexo d，避免与 CI 争抢发布。
deploy:

# Search
## 主题导航栏的搜索框依赖此插件生成 search.xml 索引
## 插件: https://github.com/wzpan/hexo-generator-search
search:
  path: search.xml
  field: post
  content: true

# MathJax
## 由 hexo-filter-mathjax 在构建期服务端渲染，不依赖任何 CDN。
## every_page 为 true 时全站文章统一处理，无需在 front-matter 写 `mathjax: true`。
## 插件: https://github.com/stevenjoezhang/hexo-filter-mathjax
mathjax:
  tags: none
  single_dollars: true
  cjk_width: 0.9
  normal_width: 0.6
  append_css: true
  every_page: true
  # 加载 AMS 数学包，否则 aligned / pmatrix / cases / bmatrix 等环境会报
  # "Unknown environment"。
  packages:
    - ams

# Obsidian 双链
## 把 [[文件名]]、[[文件名#锚点]]、[[文件名|别名]] 转成文章永久链接。
## 匹配依据是文件名（不含 .md），与 Obsidian 的 [[ ]] 语义一致；同名文件会互相覆盖，需保证文件名唯一。
## 插件: https://github.com/uuanqin/hexo-filter-titlebased-link
titlebased_link:
  enable: true
  backlinks:
    enable: false